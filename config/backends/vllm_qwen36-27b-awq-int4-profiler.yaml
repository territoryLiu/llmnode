backend:
  backend_type: vllm
  container_name: qwen36-27b-awq-int4-profiler-vllm
  image_name: vllm/vllm-openai:nightly
  model_dir: models/Qwen/Qwen3.6-27B-AWQ-INT4
  model_file: ""
  model_name: qwen36-27b-awq-int4
  display_name: Qwen3.6 27B AWQ INT4 Profiler
  enabled: true
  host_port: 15673
  gpu_memory_utilization: 0.55
  tensor_parallel_size: 1
  max_model_len: 262144
  max_num_seqs: 4
  shm_size: 16g
  enable_auto_tool_choice: true
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder
  profiler_config: '{"profiler":"torch","torch_profiler_dir":"/tmp/vllm-profile"}'
  profiler_host_dir: runtime/data/profiles/stage4-awq-profiler
