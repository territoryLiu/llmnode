backend:
  backend_type: sglang
  container_name: qwen38-27b-awq-int4-sglang-dflash2
  image_name: lmsysorg/sglang:dev-cu13-qwen38-27b-dflash2
  model_dir: models/Qwen/Qwen3.8-27B-AWQ-INT4
  model_file: ""
  model_name: qwen38-27b-sglang-awq-int4-dflash2
  display_name: Qwen3.8 27B AWQ INT4 + DFlash2 (SGLang)
  enabled: true
  host_port: 15673
  gpu_memory_utilization: 0.70
  tensor_parallel_size: 1
  shm_size: 16g
  reasoning_parser: qwen3
  mem_fraction_static: 0.70
